<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Ollama Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-mark">✦</span><span>Ollama Chat</span></div>
        <button class="icon-button" id="newChat" title="New chat" aria-label="New chat">＋</button>
      </div>
      <div class="search-wrap"><span>⌕</span><input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off" /></div>
      <div class="chat-list" id="chatList"></div>
      <div class="sidebar-bottom">
        <div class="memory-card"><div class="memory-title"><span>◈</span> Memory</div><div id="memoryStatus">Local chat memory is on</div></div>
        <button class="settings-button" id="clearMemory">Clear saved chats</button>
      </div>
    </aside>

    <section class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open chat history">☰</button>
        <div class="conversation-title"><div id="chatTitle">New chat</div><span id="status">Connecting…</span></div>
        <div class="model-area"><span class="model-label">MODEL</span><select id="model" aria-label="Ollama model"></select><button class="refresh-button" id="refreshModels" title="Refresh models" aria-label="Refresh models">↻</button></div>
      </header>

      <main id="chat" class="chat-area">
        <div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>What are we building?</h1><p>Your local AI, with persistent chats and searchable memory.</p><div class="feature-row"><span>⌘ Local</span><span>◷ History</span><span>◈ Memory</span></div></div>
      </main>

      <footer class="composer-area">
        <form id="form" class="composer"><textarea id="input" placeholder="Message your local AI…" rows="1" autocomplete="off"></textarea><button id="send" class="send-button" type="submit" aria-label="Send message">↑</button></form>
        <div class="composer-hint">Enter to send · Shift + Enter for a new line · Your chats stay in this browser</div>
      </footer>
    </section>
  </div>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <script src="app.js"></script>
</body>
</html>
