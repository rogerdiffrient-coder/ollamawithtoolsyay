<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111318; color: #f1f3f5; height: 100vh; display: flex; }
    .app { width: min(100%, 1000px); margin: auto; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 16px 20px; border-bottom: 1px solid #292d35; display: flex; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    select, button, textarea { font: inherit; }
    select { margin-left: auto; background: #1b1f27; color: #fff; border: 1px solid #343a46; border-radius: 8px; padding: 8px 10px; max-width: 280px; }
    #status { font-size: 12px; color: #8f98a8; }
    main { overflow-y: auto; padding: 28px 20px; }
    .empty { text-align: center; color: #7f8795; margin-top: 18vh; }
    .message { max-width: 820px; margin: 0 auto 20px; white-space: pre-wrap; line-height: 1.55; }
    .role { font-size: 12px; font-weight: 700; color: #8992a3; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; }
    .bubble { background: #1a1e26; border: 1px solid #292e38; border-radius: 12px; padding: 12px 14px; }
    .user .bubble { background: #202630; }
    footer { padding: 14px 20px 18px; border-top: 1px solid #292d35; }
    form { max-width: 820px; margin: auto; display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; background: #1a1e26; color: #fff; border: 1px solid #343a46; border-radius: 10px; padding: 12px; outline: none; }
    textarea:focus, select:focus { border-color: #687386; }
    button { border: 0; border-radius: 10px; padding: 0 18px; background: #f1f3f5; color: #111318; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    .error { color: #ff8f8f; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Ollama Chat</h1>
      <span id="status">Checking Ollama…</span>
      <select id="model" aria-label="Ollama model"></select>
    </header>

    <main id="chat">
      <div class="empty" id="empty">Choose a model and start chatting.</div>
    </main>

    <footer>
      <form id="form">
        <textarea id="input" placeholder="Message your local AI…" rows="1" autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </footer>
  </div>

  <script>
    const OLLAMA = 'http://localhost:11434';
    const modelSelect = document.querySelector('#model');
    const status = document.querySelector('#status');
    const chat = document.querySelector('#chat');
    const empty = document.querySelector('#empty');
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    let messages = [];

    function addMessage(role, text = '') {
      empty.style.display = 'none';
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'AI'}</div><div class="bubble"></div>`;
      el.querySelector('.bubble').textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el.querySelector('.bubble');
    }

    async function loadModels() {
      try {
        const response = await fetch(`${OLLAMA}/api/tags`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const models = data.models || [];
        modelSelect.innerHTML = '';
        if (!models.length) {
          modelSelect.innerHTML = '<option>No models installed</option>';
          modelSelect.disabled = true;
          status.textContent = 'No models found';
          return;
        }
        for (const model of models) {
          const option = document.createElement('option');
          option.value = model.name;
          option.textContent = model.name;
          modelSelect.appendChild(option);
        }
        modelSelect.disabled = false;
        status.textContent = `${models.length} model${models.length === 1 ? '' : 's'} found`;
      } catch (error) {
        modelSelect.innerHTML = '<option>Ollama unavailable</option>';
        modelSelect.disabled = true;
        status.textContent = 'Can’t connect to Ollama';
        status.className = 'error';
        console.error(error);
      }
    }

    async function sendMessage(text) {
      const model = modelSelect.value;
      if (!model || model === 'Ollama unavailable' || model === 'No models installed') return;

      messages.push({ role: 'user', content: text });
      addMessage('user', text);
      const bubble = addMessage('assistant', '');
      send.disabled = true;
      input.disabled = true;
      status.textContent = 'Thinking…';

      try {
        const response = await fetch(`${OLLAMA}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, messages, stream: true })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (!response.body) throw new Error('Streaming is not supported by this browser.');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let answer = '';
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const chunk = JSON.parse(line);
            answer += chunk.message?.content || '';
            bubble.textContent = answer;
            chat.scrollTop = chat.scrollHeight;
          }
        }
        messages.push({ role: 'assistant', content: answer });
        status.textContent = `${model}`;
      } catch (error) {
        bubble.textContent = `Error: ${error.message}`;
        bubble.classList.add('error');
        messages.pop();
        status.textContent = 'Request failed';
        console.error(error);
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = '';
      sendMessage(text);
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    loadModels();
  </script>
</body>
</html>
